<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Pontaj șantier</title>
<meta name="theme-color" content="#020617">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#f1f5f9; --mut:#94a3b8; --ok:#16a34a; --bad:#dc2626; --acc:#2563eb; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.35 system-ui,-apple-system,Roboto,Arial,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#020617; border-bottom:1px solid var(--line); }
  header b { font-size:18px; } #ceas { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  main { padding:12px; max-width:900px; margin:0 auto; }
  .row { display:flex; gap:12px; align-items:stretch; }
  .hero { display:flex; flex-direction:column; gap:12px; height:calc(100vh - 86px); height:calc(100dvh - 86px); min-height:420px; }
  #camWrap { position:relative; width:100%; flex:1 1 58%; min-height:0; border-radius:18px; overflow:hidden; background:#000; border:2px solid var(--line); }
  @media (orientation: landscape) { .hero { flex-direction:row; } #camWrap { flex:1 1 50%; } #mic { flex:1 1 50%; } }
  #cam { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #camMsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:16px; color:var(--mut); padding:12px; }
  #mic { flex:1 1 42%; min-height:0; border:0; border-radius:22px; background:var(--acc); color:#fff; font-size:34px; font-weight:800; padding:16px; line-height:1.15; }
  #mic.asculta { background:var(--bad); animation:puls 1s infinite; }
  @keyframes puls { 50% { filter:brightness(1.3); } }
  #mic small { display:block; font-size:17px; font-weight:400; opacity:.9; margin-top:10px; line-height:1.35; }
  .txt { display:flex; gap:8px; margin-top:12px; }
  .txt input { flex:1; font-size:18px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--txt); }
  button.b { border:0; border-radius:12px; padding:12px 14px; font-size:16px; font-weight:600; background:var(--card); color:var(--txt); border:1px solid var(--line); }
  button.p { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.no { background:transparent; color:var(--mut); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:12px; }
  .grid button { min-height:56px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:12px; }
  .card h3 { margin:0 0 8px; font-size:16px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  #conf .mare { font-size:26px; font-weight:800; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .chip { padding:10px 12px; border-radius:999px; background:#0b1220; border:1px solid var(--line); color:var(--txt); font-size:16px; }
  .chip.sel { background:var(--acc); border-color:var(--acc); }
  #rez { display:none; position:fixed; left:12px; right:12px; top:84px; z-index:20; border-radius:20px; padding:26px 18px; font-size:28px; font-weight:800; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  #rez.ok { display:block; background:var(--ok); } #rez.bad { display:block; background:var(--bad); }
  ul.lista { list-style:none; margin:0; padding:0; } ul.lista li { padding:8px 0; border-bottom:1px solid var(--line); }
  ul.lista li small { color:var(--mut); }
  .ascuns { display:none !important; }
  #auzit { color:var(--mut); font-style:italic; margin:4px 0 0; min-height:20px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:10px; } .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width linear; }
  input.cauta { width:100%; font-size:18px; padding:10px; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--txt); margin-top:6px; }
  #err { color:#fecaca; background:#7f1d1d; padding:12px; border-radius:12px; margin-top:12px; display:none; }
</style>
</head>
<body>
<header><b>🏗️ <span id="santier">Șantier</span></b><span><span id="ceas">--:--</span> <button id="setari" style="background:none;border:0;font-size:26px;vertical-align:middle">⚙️</button></span></header>
<main>
  <div class="hero">
    <div id="camWrap"><video id="cam" autoplay playsinline muted></video><div id="camMsg">Pornesc camera…</div></div>
    <button id="mic">🎤 APASĂ ȘI VORBEȘTE<small>„Grosu Mihai, am venit” • „…am plecat” • „…am luat flexul și bormașina” • „…am nevoie de discuri”</small></button>
  </div>
  <p id="auzit"></p>
  <div class="txt"><input id="text" placeholder="sau scrie / dictează cu tastatura aici…" autocomplete="off"><button class="b p" id="trimite">OK</button></div>

  <div id="err"></div>
  <div id="rez"></div>

  <div id="conf" class="card ascuns">
    <h3>Am înțeles</h3>
    <div class="mare" id="cNume" title="apasă pentru alt nume">—</div>
    <div class="chips" id="cNumeAlt"></div>
    <input class="cauta ascuns" id="cNumeCauta" placeholder="caută numele…">
    <div class="chips ascuns" id="cNumeLista"></div>
    <div class="mare" id="cAct" style="color:#93c5fd">—</div>
    <div id="cObiectWrap" class="ascuns">
      <div class="chips" id="cObiect"></div>
      <input class="cauta" id="cObiectText" placeholder="ce anume?">
    </div>
    <div class="row" style="margin-top:12px"><button class="b ok" id="da" style="flex:2;font-size:22px">✅ CONFIRM</button><button class="b no" id="nu" style="flex:1">✖ Anulează</button></div>
    <div id="lipsa" style="color:#fbbf24;font-weight:700;font-size:18px;margin-top:10px"></div>
    <div class="bar"><i id="barI"></i></div>
  </div>

  <div class="card">
    <h3>Sau alege acțiunea</h3>
    <div class="grid" id="actiuni"></div>
  </div>

  <div class="card"><h3>🛒 De cumpărat (cereri deschise)</h3><ul class="lista" id="lMat"><li><small>—</small></li></ul></div>
  <p id="metoda" style="color:#475569;font-size:12px;text-align:center"></p>
  <input type="file" id="fotoInput" accept="image/*" capture="user" class="ascuns">
</main>

<script>
var CHEIE = '', SANTIER = '', D = { oameni: [], luate: [], materiale: [] };
var stare = null, timer = null, stream = null, rec = null;

var ACT = {
  VENIT: { t: '✅ AM VENIT', obiect: false },
  PLECAT: { t: '🏁 AM PLECAT', obiect: false },
  LUAT: { t: '🔧 AM LUAT', obiect: 'scula' },
  ADUS: { t: '↩️ AM RETURNAT', obiect: 'scula' },
  UTILAJ: { t: '🛢️ AM GRESAT ȘI ȘTERS UTILAJUL', obiect: false },
  MATERIAL_CERUT: { t: '🛒 AM NEVOIE DE', obiect: 'material' },
  MATERIAL_PRIMIT: { t: '📦 AM PRIMIT MATERIALUL', obiect: 'materialDeschis' }
};

/* ---------- legătura cu tabelul (Apps Script) ---------- */
// prima deschidere: ...index.html?api=ADRESA_EXEC&k=CHEIA&s=Șantier  → se memorează pe telefon
var Q = new URLSearchParams(location.search), API = '';
function mem(k, v) { try { if (v) localStorage.setItem(k, v); return localStorage.getItem(k) || ''; } catch (e) { return v || ''; } }
API = mem('pontaj_api', Q.get('api'));
CHEIE = mem('pontaj_k', Q.get('k'));
SANTIER = mem('pontaj_s', Q.get('s'));

// Citire fără conturi Google atașate (altfel Google se încurcă la mai multe conturi pe telefon).
// Se încearcă pe rând 3 metode; cea care merge se ține minte.
function jsonp(url, ms, anonim) {
  return new Promise(function (ok, fail) {
    var cb = 'cb' + Date.now() + Math.floor(Math.random() * 1e6), sc = document.createElement('script'), t;
    if (anonim) sc.crossOrigin = 'anonymous';
    window[cb] = function (d) { clearTimeout(t); delete window[cb]; sc.remove(); ok(d); };
    sc.onerror = function () { clearTimeout(t); delete window[cb]; sc.remove(); fail(new Error('script')); };
    t = setTimeout(function () { delete window[cb]; sc.remove(); fail(new Error('timp expirat')); }, ms || 20000);
    sc.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'cb=' + cb;
    document.head.appendChild(sc);
  });
}
var METODE = {
  fetch: function (url, ms) { return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (r) { return r.json(); }); },
  anonim: function (url, ms) { return jsonp(url, ms, true); },
  script: function (url, ms) { return jsonp(url, ms, false); }
};
var metoda = mem('pontaj_metoda', '') || '';
// două forme ale aceleiași adrese: /macros/s/… și /a/macros/scmonolit.ro/s/… (pe unele telefoane merge doar una)
function adrese() {
  var a = [API], alt = /\/a\/macros\/[^/]+\/s\//.test(API) ? API.replace(/\/a\/macros\/[^/]+\/s\//, '/macros/s/') : API.replace('/macros/s/', '/a/macros/scmonolit.ro/s/');
  if (alt !== API) a.push(alt);
  var bun = mem('pontaj_api_ok', ''); if (bun && a.indexOf(bun) >= 0) a.sort(function (x) { return x === bun ? -1 : 1; });
  return a;
}
var APIBUN = '';
function citeste(cale, ms) {
  var incercari = [], erori = [];
  adrese().forEach(function (u) { (metoda ? [metoda] : ['fetch', 'anonim', 'script']).forEach(function (m) { incercari.push([u, m]); }); });
  return incercari.reduce(function (pr, im) {
    return pr.catch(function () {
      return METODE[im[1]](im[0] + cale, ms).then(function (d) {
        APIBUN = im[0]; mem('pontaj_api_ok', im[0]);
        if (metoda !== im[1]) { metoda = im[1]; mem('pontaj_metoda', im[1]); }
        el('metoda').textContent = 'legătură: ' + im[1] + (im[0].indexOf('/a/macros/') >= 0 ? ' (adresă cu domeniu)' : '');
        return d;
      }).catch(function (e) { erori.push(im[1] + (im[0].indexOf('/a/macros/') >= 0 ? '/domeniu' : '') + ': ' + e.message); throw e; });
    });
  }, Promise.reject()).catch(function () {
    if (metoda) { metoda = ''; try { localStorage.removeItem('pontaj_metoda'); } catch (e) {} return citeste(cale, ms); }
    throw new Error('nicio metodă nu merge – ' + erori.join('; '));
  });
}
var server = {
  init: function (ok, fail) {
    citeste('?api=init&k=' + encodeURIComponent(CHEIE) + '&s=' + encodeURIComponent(SANTIER))
      .then(function (j) { j.ok ? ok(j.r) : fail(new Error(j.eroare)); }).catch(fail);
  },
  trimite: function (p, ok, fail) {
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8), incercari = 0;
    function verifica() {
      citeste('?api=rez&id=' + id, 15000).then(function (j) {
        if (j.asteapta) { if (++incercari > 20) return fail(new Error('nu am primit confirmarea – verifică în tabel')); return setTimeout(verifica, 1500); }
        j.ok ? ok(j.r) : fail(new Error(j.eroare));
      }).catch(function (e) { if (++incercari > 20) fail(e); else setTimeout(verifica, 1500); });
    }
    fetch(APIBUN || API, { method: 'POST', mode: 'no-cors', credentials: 'include', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: CHEIE, p: p, id: id }) })
      .then(function () { setTimeout(verifica, 800); })
      .catch(function () { setTimeout(verifica, 800); });
  }
};

/* ---------- pornire ---------- */
if (!API || !CHEIE) arataEroare('Lipsește legătura cu tabelul. Deschide o dată adresa completă: …?api=ADRESA_APLICATIEI&k=CHEIA');
else incarca();
setInterval(function () { var d = new Date(); el('ceas').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()); }, 1000);
try { navigator.wakeLock && navigator.wakeLock.request('screen'); } catch (e) {}
document.addEventListener('visibilitychange', function () { try { if (!document.hidden && navigator.wakeLock) navigator.wakeLock.request('screen'); } catch (e) {} });

function incarca() {
  server.init(function (r) {
    D = r; SANTIER = r.santier; el('santier').textContent = 'Șantier ' + r.santier;
    el('err').style.display = 'none';
    randeazaListe();
  }, function (e) {
    var x = el('err'); clearTimeout(x._t); x.style.display = 'block';
    x.textContent = '❌ Nu pot citi datele din tabel (' + ((e && e.message) || e) + '). Apasă ⚙️ sus și lipește din nou adresa aplicației (cea care se termină în /exec). Adresa folosită acum: ' + (API || '—');
  });
}
el('setari').onclick = function () {
  var a = prompt('Adresa aplicației (se termină în /exec):', API || '');
  if (a === null) return;
  a = a.trim().replace(/\?.*$/, '');
  var k = prompt('Cheia de acces:', CHEIE || '');
  if (k === null) return;
  var s = prompt('Șantierul acestui telefon:', SANTIER || 'Sighișoara');
  API = mem('pontaj_api', a); CHEIE = mem('pontaj_k', k.trim()); SANTIER = mem('pontaj_s', (s || '').trim());
  metoda = ''; try { localStorage.removeItem('pontaj_metoda'); } catch (e) {}
  incarca();
};

Object.keys(ACT).forEach(function (k) {
  var b = document.createElement('button'); b.className = 'b'; b.textContent = ACT[k].t;
  b.onclick = function () { porneste({ nume: null, candidati: [], actiune: k, obiectText: '', text: '' }); };
  el('actiuni').appendChild(b);
});

/* ---------- camera ---------- */
(function () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { el('camMsg').textContent = 'Fără cameră live – poza se face la confirmare'; return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false })
    .then(function (s) { stream = s; el('cam').srcObject = s; el('camMsg').textContent = ''; })
    .catch(function () { el('camMsg').textContent = 'Camera live blocată – poza se face la confirmare'; });
})();

function fotografiaza() {
  return new Promise(function (resolve) {
    var v = el('cam');
    if (stream && v.videoWidth) {
      var c = document.createElement('canvas'); c.width = 480; c.height = Math.round(480 * v.videoHeight / v.videoWidth);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.7)); return;
    }
    var inp = el('fotoInput');
    inp.value = '';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return resolve('');
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () {
        var c = document.createElement('canvas'), w = 480; c.width = w; c.height = Math.round(w * img.height / img.width);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { resolve(''); };
      img.src = url;
    };
    inp.click();
  });
}

/* ---------- voce ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
el('mic').onclick = function () {
  if (!SR) { el('text').focus(); arataEroare('Recunoașterea vocală nu e disponibilă aici – apasă pe 🎤 de pe tastatură și dictează în câmpul de text.'); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'ro-RO'; rec.interimResults = true; rec.maxAlternatives = 1;
  el('mic').classList.add('asculta');
  var ultim = '', procesat = false;
  rec.onresult = function (e) {
    var t = ''; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    ultim = t; el('auzit').textContent = '„' + t + '”';
    if (e.results[e.results.length - 1].isFinal && !procesat) { procesat = true; intelege(t); }
  };
  rec.onerror = function (e) { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { el('text').focus(); arataEroare('Microfonul nu e permis aici – folosește 🎤 de pe tastatură în câmpul de text.'); } };
  rec.onend = function () { rec = null; el('mic').classList.remove('asculta'); if (ultim && !procesat) { procesat = true; intelege(ultim); } };
  try { rec.start(); } catch (e) { rec = null; el('mic').classList.remove('asculta'); }
};
el('trimite').onclick = function () { var t = el('text').value.trim(); if (t) { el('auzit').textContent = '„' + t + '”'; intelege(t); el('text').value = ''; } };
el('text').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('trimite').click(); });

/* ---------- înțelegere text ---------- */
var REG = [
  ['UTILAJ', /(gresat|uns|gresare|ungere).*(sters|curatat|spalat)|(sters|curatat|spalat).*(gresat|uns)|\butilaj(ul)?\b/],
  ['PLECAT', /(terminat programul|gata pe azi|gata programul)/],
  ['MATERIAL_PRIMIT', /\b(am primit|a venit materialul|au venit|a sosit|au sosit|am primit materialul)\b/],
  ['MATERIAL_CERUT', /\b(am nevoie( de)?|avem nevoie( de)?|imi trebuie|ne trebuie|ne lipseste|ne lipsesc|imi lipseste|lipseste|lipsesc|cumparati( mi| ne)?|sa (mi|ne) (cumparati|luati|aduceti)|comandati|cer|trebuie sa (mi |ne |i |se )?(cumpere|cumparati|cumpar|luati|aduceti|comandati)|sa (se |mi |ne |i )?cumpere|de cumparat|vreau|imi trebe|ne trebe|lipsa|cump[a-z]*)\b/],
  ['ADUS', /\b(am adus|aduc inapoi|am returnat|returnat|returnez|am dat inapoi|dau inapoi|am pus inapoi|am predat|predau|am lasat inapoi)\b/],
  ['LUAT', /\b(am luat|iau|imprumut|am imprumutat|scot|am scos)\b/],
  ['PLECAT', /\b(am plecat|plec|plecat|ies|am iesit|la revedere|ma duc acasa)\b/],
  ['VENIT', /\b(am venit|am ajuns|venit|sosit|am intrat|intru|bun[ae] dimineata|incep)\b/]
];

function intelege(text) {
  var n = norm(text), act = null, poz = -1, lung = 0;
  for (var i = 0; i < REG.length; i++) { var m = n.match(REG[i][1]); if (m) { act = REG[i][0]; poz = m.index; lung = m[0].length; break; } }
  var inainte = poz > 0 ? n.slice(0, poz) : n, dupa = poz >= 0 ? n.slice(poz + lung).trim() : '';
  if (act === 'MATERIAL_CERUT') dupa = dupa.replace(/^(sa |si )*(imi |ne |mi |i |se )?(cump[a-z]*|luati|aduceti|comandati)\s+/, '');
  dupa = dupa.replace(/^(de|cu|la|pe|un|o|niste|si)\s+/, '');
  if (act === 'MATERIAL_CERUT' || act === 'LUAT' || act === 'ADUS') dupa = dupa ? text.trim().split(/\s+/).slice(-dupa.split(' ').filter(Boolean).length).join(' ') : '';
  var cand = cautaOm(inainte.trim() ? inainte : n);
  if (!cand.length && poz >= 0) cand = cautaOm(n);
  porneste({ nume: cand.length === 1 || (cand.length > 1 && cand[0].s > cand[1].s) ? cand[0].o.nume : null, candidati: cand.slice(0, 6), actiune: act, obiectText: dupa, text: text });
}

function cautaOm(t) {
  var tok = t.split(' ').filter(Boolean), rez = [];
  D.oameni.forEach(function (o) {
    var nn = norm(o.nume), parti = nn.split(' '), s = 0;
    if (t.indexOf(nn) >= 0 || t.indexOf(parti.slice().reverse().join(' ')) >= 0) s = 100;
    String(o.porecle || '').split(',').map(norm).filter(Boolean).forEach(function (p) { if ((' ' + t + ' ').indexOf(' ' + p + ' ') >= 0) s = Math.max(s, 90); });
    if (!s) {
      if (tok.indexOf(parti[0]) >= 0) s += 10;
      parti.slice(1).forEach(function (p) { if (tok.indexOf(p) >= 0) s += 6; });
    }
    if (s && SANTIER && norm(o.santier) === norm(SANTIER)) s += 1;
    if (s) rez.push({ o: o, s: s });
  });
  return rez.sort(function (a, b) { return b.s - a.s; });
}

function cautaObiect(tip, t) {
  var lista = [];
  if (tip === 'materialDeschis') lista = D.materiale.map(function (x) { return { id: x.rand, txt: x.material + ' (' + x.nume + ', ' + x.data + ')', cheie: x.material }; });
  var q = norm(t).split(' ').filter(function (w) { return w.length >= 3 || /\d/.test(w); });
  return lista.map(function (x) {
    var k = ' ' + norm(x.cheie) + ' ', s = 0;
    q.forEach(function (w) { if (k.indexOf(' ' + w) >= 0) s += 2; else if (w.length >= 5 && k.indexOf(w.slice(0, 4)) >= 0) s += 1; });
    return { x: x, s: s, b: x.bonus || 0 };
  }).filter(function (a) { return a.s > 0 || !q.length; })
    .map(function (a) { if (a.s > 0) a.s += a.b * 0.5; return a; }).sort(function (a, b) { return b.s - a.s; });
}

/* ---------- confirmare ---------- */
function porneste(st) {
  ascundeRez(); stare = st; stare.obiect = null; opresteTimer();
  el('conf').classList.remove('ascuns');
  if (!st.actiune) { stare.actiune = null; }
  randeazaConf();
  window.scrollTo({ top: el('conf').offsetTop - 10, behavior: 'smooth' });
}

function randeazaConf() {
  var st = stare;
  el('cNume').textContent = st.nume || 'Cine ești? Alege numele:';
  var alt = el('cNumeAlt'); alt.innerHTML = '';
  (st.candidati || []).forEach(function (c) {
    var b = chip(c.o.nume, st.nume === c.o.nume, function () { st.nume = c.o.nume; randeazaConf(); });
    alt.appendChild(b);
  });
  var arataLista = !st.nume || !(st.candidati || []).length;
  el('cNumeCauta').classList.toggle('ascuns', !arataLista && !!st.nume);
  el('cNumeLista').classList.toggle('ascuns', !arataLista && !!st.nume);
  listaNume();
  el('cAct').textContent = st.actiune ? ACT[st.actiune].t : '❓ Ce ai făcut? Alege mai jos';
  var tip = st.actiune && ACT[st.actiune].obiect;
  el('cObiectWrap').classList.toggle('ascuns', !tip);
  if (tip) {
    var luateDeEl = (D.luate || []).filter(function (x) { return st.nume && norm(x.nume) === norm(st.nume); });
    if (!el('cObiectText').value && st.obiectText) el('cObiectText').value = st.obiectText;
    if (!el('cObiectText').value && st.actiune === 'ADUS' && luateDeEl.length === 1) el('cObiectText').value = luateDeEl[0].scula;
    el('cObiectText').placeholder = { scula: 'ce sculă? (ex. flex, bormașină – mai multe cu virgulă)', material: 'ce material / cât?', materialDeschis: 'ce material ai primit?' }[tip];
    var box = el('cObiect'); box.innerHTML = '';
    if (tip === 'scula' && st.actiune === 'ADUS' && luateDeEl.length) {
      // sculele pe care le are luate omul – apasă ca să le adaugi
      box.appendChild(Object.assign(document.createElement('small'), { textContent: 'Are luate: ', style: 'color:#94a3b8;align-self:center' }));
      luateDeEl.forEach(function (x) {
        var inText = norm(el('cObiectText').value).indexOf(norm(x.scula)) >= 0;
        box.appendChild(chip(x.scula + ' · ' + x.ora, inText, function () {
          var v = el('cObiectText').value.trim();
          el('cObiectText').value = inText ? v : (v ? v + ', ' : '') + x.scula; randeazaConf();
        }));
      });
    }
    if (tip === 'materialDeschis') {
      var r = cautaObiect(tip, el('cObiectText').value).slice(0, 8);
      if (!st.obiect && r.length && (r.length === 1 || r[0].s > r[1].s) && r[0].s > 0) st.obiect = r[0].x;
      r.forEach(function (a) { box.appendChild(chip(a.x.txt, st.obiect && st.obiect.id === a.x.id, function () { st.obiect = a.x; randeazaConf(); })); });
      if (!r.length) box.innerHTML = '<small style="color:#fca5a5">Nimic deschis pe listă.</small>';
    }
  }
  var gata = st.nume && st.actiune && (!tip || (tip === 'scula' && el('cObiectText').value.trim()) ||
             (tip === 'material' && el('cObiectText').value.trim()) || (tip === 'materialDeschis' && st.obiect));
  el('da').disabled = !gata; el('da').style.opacity = gata ? 1 : .4;
  el('lipsa').textContent = gata ? '' : (!st.nume ? '👆 Alege numele de mai sus' : !st.actiune ? '👇 Alege ce ai făcut din butoanele de jos' :
    tip === 'scula' ? (st.actiune === 'ADUS' ? '👆 Apasă ce ai returnat sau scrie scula' : '✍️ Scrie ce sculă ai luat (ex. flex)') : tip === 'material' ? '✍️ Scrie ce material trebuie cumpărat' : '👆 Alege din listă');
  opresteTimer();
  if (gata && (st.candidati || []).length && st.text) { pornesteTimer(5); el('lipsa').textContent = '⏳ Se confirmă singur în 5 secunde…'; }
}

function listaNume() {
  var q = norm(el('cNumeCauta').value), box = el('cNumeLista'); box.innerHTML = '';
  D.oameni.filter(function (o) { return !q || norm(o.nume + ' ' + o.porecle).indexOf(q) >= 0; })
    .sort(function (a, b) { return (norm(b.santier) === norm(SANTIER)) - (norm(a.santier) === norm(SANTIER)) || a.nume.localeCompare(b.nume); })
    .slice(0, 40).forEach(function (o) { box.appendChild(chip(o.nume, stare && stare.nume === o.nume, function () { stare.nume = o.nume; randeazaConf(); })); });
}
el('cNumeCauta').oninput = listaNume;
el('cNume').onclick = function () { el('cNumeCauta').classList.remove('ascuns'); el('cNumeLista').classList.remove('ascuns'); listaNume(); el('cNumeCauta').focus(); };
el('cObiectText').oninput = function () { stare.obiect = null; randeazaConf(); };
el('nu').onclick = function () { opresteTimer(); el('conf').classList.add('ascuns'); stare = null; el('cObiectText').value = ''; };
el('da').onclick = confirma;
// acțiunile din grilă completează acțiunea curentă dacă e deschisă confirmarea
Array.prototype.forEach.call(el('actiuni').children, function (b, i) {
  var k = Object.keys(ACT)[i];
  b.onclick = function () {
    if (stare && !el('conf').classList.contains('ascuns')) { stare.actiune = k; stare.obiect = null; randeazaConf(); }
    else porneste({ nume: null, candidati: [], actiune: k, obiectText: '', text: '' });
  };
});

function pornesteTimer(sec) {
  var i = el('barI'); i.style.transition = 'none'; i.style.width = '0';
  setTimeout(function () { i.style.transition = 'width ' + sec + 's linear'; i.style.width = '100%'; }, 30);
  timer = setTimeout(confirma, sec * 1000);
}
function opresteTimer() { if (timer) clearTimeout(timer); timer = null; var i = el('barI'); i.style.transition = 'none'; i.style.width = '0'; }

function confirma() {
  opresteTimer();
  if (!stare || el('da').disabled) return;
  var st = stare, tip = ACT[st.actiune].obiect, txt = el('cObiectText').value.trim();
  var p = { santier: SANTIER, nume: st.nume, actiune: st.actiune, text: st.text || '' };
  if (tip === 'scula') p.sculaText = txt;
  if (tip === 'material') p.materialText = txt;
  if (tip === 'materialDeschis') { p.materialText = txt || (st.obiect && st.obiect.txt); if (st.obiect) p.materialRand = st.obiect.id; }
  el('da').disabled = true; el('da').textContent = '⏳ Salvez…';
  var trimite = function (foto) {
    p.foto = foto || '';
    server.trimite(p, function (r) {
      el('da').textContent = '✅ CONFIRM'; el('conf').classList.add('ascuns'); el('cObiectText').value = ''; stare = null;
      arataRez(r); incarca();
    }, function (e) { el('da').textContent = '✅ CONFIRM'; el('da').disabled = false; eroare(e); });
  };
  if (st.actiune === 'VENIT') fotografiaza().then(trimite); else trimite('');  // poza doar dimineața, la venire
}

/* ---------- rezultat + liste ---------- */
function arataRez(r) {
  var b = el('rez'); b.className = r.rosu || !r.ok ? 'bad' : 'ok'; b.textContent = r.mesaj; el('err').style.display = 'none';
  vorbeste(r.voce || r.mesaj);
  clearTimeout(b._t); b._t = setTimeout(ascundeRez, 9000);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function ascundeRez() { el('rez').className = ''; }
el('rez').onclick = ascundeRez;

function randeazaListe() {
  var m = el('lMat'); m.innerHTML = '';
  (D.materiale || []).forEach(function (x) { var li = document.createElement('li'); li.innerHTML = esc(x.material) + ' <small>– ' + esc(x.nume) + ', ' + esc(x.data) + '</small>'; m.appendChild(li); });
  if (!m.children.length) m.innerHTML = '<li><small>Nimic de cumpărat</small></li>';
}

function vorbeste(t) {
  try { var u = new SpeechSynthesisUtterance(String(t).replace(/[⚠️✔✅📷]/g, '')); u.lang = 'ro-RO'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function eroare(e) { arataEroare((e && e.message) || String(e)); }
function arataEroare(t) { var x = el('err'); x.textContent = t; x.style.display = 'block'; try { x.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {} clearTimeout(x._t); x._t = setTimeout(function () { x.style.display = 'none'; }, 10000); }

/* ---------- utilitare ---------- */
function el(id) { return document.getElementById(id); }
function pad(n) { return ('0' + n).slice(-2); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function chip(t, sel, fn) { var b = document.createElement('button'); b.className = 'chip' + (sel ? ' sel' : ''); b.textContent = t; b.onclick = fn; return b; }
</script>
</body>
</html>
